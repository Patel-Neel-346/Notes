<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-text,system-ui,sans-serif);font-size:12px;color:var(--text-normal,#ddd);line-height:1.4;padding:6px;background:transparent}
.mt-row{display:flex;gap:6px;margin-bottom:5px}
.mt-col{flex:1;min-width:0}
.mt-lbl{font-size:9px;color:var(--text-muted,#888);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.mt-box{background:var(--background-secondary,#1e1e2e);border-radius:6px;padding:5px 7px;font-family:var(--font-mono,monospace);font-size:11px}

/* Source */
.mt-src{line-height:1.5;font-size:11px}
.mt-sl{padding:0 3px;border-radius:2px;display:block}
.mt-sl.on{background:var(--interactive-accent,#7c3aed)18}

/* Memory table */
.mt-mem{width:100%;border-collapse:collapse;font-size:10px;line-height:1.4}
.mt-mem th{text-align:left;padding:2px 4px;border-bottom:1px solid #333;color:var(--text-muted,#888);font-size:9px;font-weight:500}
.mt-mem td{padding:2px 4px}
.mt-mem tr.new{background:var(--interactive-accent,#7c3aed)12}
.mt-mem tr.freed{opacity:.35;text-decoration:line-through}
.mt-ptr{font-size:8px;font-weight:700;margin-left:2px}
.sp-ptr{color:var(--interactive-accent,#7c3aed)}
.bp-ptr{color:#22c55e}

/* Registers */
.mt-regs{display:flex;gap:4px;margin-bottom:5px}
.mt-rg{flex:1;background:var(--background-secondary,#1e1e2e);border-radius:5px;padding:3px 5px;text-align:center}
.mt-rl{font-size:8px;color:var(--text-muted,#888);text-transform:uppercase}
.mt-rv{font-family:var(--font-mono,monospace);font-size:12px;font-weight:600}
.mt-rv.ch{color:var(--interactive-accent,#7c3aed)}

/* Phase badge */
.mt-ph{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:4px}
.ph-p{background:#7c3aed22;color:#a78bfa}
.ph-e{background:#3b82f622;color:#60a5fa}
.ph-ep{background:#f59e0b22;color:#fbbf24}
.ph-c{background:#10b98122;color:#34d399}

/* Note */
.mt-note{font-size:11px;color:var(--text-muted,#aaa);line-height:1.4;padding:4px 6px;background:var(--background-secondary,#1e1e2e);border-radius:5px;border-left:2px solid var(--interactive-accent,#7c3aed);margin-bottom:5px;min-height:28px}

/* Controls */
.mt-ctrl{display:flex;align-items:center;justify-content:center;gap:8px}
.mt-ctrl button{font-size:11px;padding:3px 10px;border-radius:4px;border:1px solid #444;background:var(--background-secondary,#1e1e2e);color:var(--text-normal,#ddd);cursor:pointer}
.mt-ctrl button:disabled{opacity:.3}
.mt-cl{font-size:10px;color:var(--text-muted,#888);min-width:80px;text-align:center}
</style>

<div id="mtPh"></div>
<div class="mt-row">
  <div class="mt-col"><div class="mt-lbl">C Source</div><div class="mt-box mt-src" id="mtSrc"></div></div>
  <div class="mt-col"><div class="mt-lbl">Stack Memory (↓ low addr)</div><div class="mt-box"><table class="mt-mem" id="mtMem"></table></div></div>
</div>
<div class="mt-regs" id="mtRegs"></div>
<div class="mt-note" id="mtNote"></div>
<div class="mt-ctrl">
  <button id="mtP" onclick="go(-1)">← Back</button>
  <span class="mt-cl" id="mtLbl"></span>
  <button id="mtN" onclick="go(1)">Next →</button>
</div>

<script>
const SRC=['int multiply(int a, int b) {','    int result = a * b;','    return result;','}','','int main() {','    int x = 4;','    int y = 5;','    int z = multiply(x, y);','    return 0;','}'];
const ST=[
{ph:'p',pl:'main() Prologue',hl:[5],sp:996,bp:996,rg:{SP:'996',BP:'996',PC:'main+0',r0:'-'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved Loader BP',n:1}],
note:"Loader jumps to main(). Prologue saves loader's BP (1200) and sets BP=996."},
{ph:'e',pl:'int x = 4',hl:[6],sp:992,bp:996,rg:{SP:'992',BP:'996',PC:'main+4',r0:'-'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x (BP-4)',n:1}],
note:"SP-=4, write x=4 at address 992."},
{ph:'e',pl:'int y = 5',hl:[7],sp:988,bp:996,rg:{SP:'988',BP:'996',PC:'main+8',r0:'-'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y (BP-8)',n:1}],
note:"SP-=4, write y=5 at address 988."},
{ph:'e',pl:'allocate z',hl:[8],sp:984,bp:996,rg:{SP:'984',BP:'996',PC:'main+12',r0:'-'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'0',l:'z (BP-12) uninit',n:1}],
note:"Space for z at BP-12. main's frame is fully set up."},
{ph:'c',pl:'call multiply(x,y)',hl:[8],sp:980,bp:996,rg:{SP:'980',BP:'996',PC:'call…',r0:'4'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'0',l:'z'},{a:980,v:'0x52C',l:'Ret Addr → main',n:1}],
note:"x→r0, y→r1. Push return address. Jump to multiply()."},
{ph:'p',pl:'multiply() Prologue',hl:[0],sp:976,bp:976,rg:{SP:'976',BP:'976',PC:'mul+0',r0:'4'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'0',l:'z'},{a:980,v:'0x52C',l:'Ret Addr'},{a:976,v:'996',l:'Saved main BP',n:1}],
note:"Push main's BP(996), set new BP=SP=976."},
{ph:'e',pl:'result = a * b',hl:[1],sp:972,bp:976,rg:{SP:'972',BP:'976',PC:'mul+4',r0:'20'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'0',l:'z'},{a:980,v:'0x52C',l:'Ret Addr'},{a:976,v:'996',l:'Saved main BP'},{a:972,v:'20',l:'result = 4×5',n:1}],
note:"ALU: 4×5=20. Written at 972 (BP-4). r0=20."},
{ph:'e',pl:'return result',hl:[2],sp:972,bp:976,rg:{SP:'972',BP:'976',PC:'mul+8',r0:'20'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'0',l:'z'},{a:980,v:'0x52C',l:'Ret Addr'},{a:976,v:'996',l:'Saved main BP'},{a:972,v:'20',l:'result'}],
note:"Return value 20 in r0. About to run epilogue."},
{ph:'ep',pl:'epilogue: collapse',hl:[3],sp:976,bp:976,rg:{SP:'976',BP:'976',PC:'leave',r0:'20'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'0',l:'z'},{a:980,v:'0x52C',l:'Ret Addr'},{a:976,v:'996',l:'Saved main BP'},{a:972,v:'20',l:'(freed) result',f:1}],
note:"SP=BP=976. 'result' at 972 is freed — bytes stay but are below SP."},
{ph:'ep',pl:'epilogue: restore BP',hl:[3],sp:980,bp:996,rg:{SP:'980',BP:'996',PC:'pop rbp',r0:'20'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'0',l:'z'},{a:980,v:'0x52C',l:'Ret Addr'},{a:976,v:'996',l:'(freed) Saved BP',f:1}],
note:"Pop saved BP(996) → BP register. BP restored to main's frame."},
{ph:'ep',pl:'epilogue: ret',hl:[8],sp:984,bp:996,rg:{SP:'984',BP:'996',PC:'0x52C',r0:'20'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'0',l:'z'}],
note:"Pop ret addr → PC. SP=984. Back in main(). multiply's frame is gone."},
{ph:'e',pl:'z = 20 ✓',hl:[8],sp:984,bp:996,rg:{SP:'984',BP:'996',PC:'main+16',r0:'20'},
mem:[{a:1000,v:'…',l:'(loader above)'},{a:996,v:'1200',l:'Saved BP'},{a:992,v:'4',l:'x'},{a:988,v:'5',l:'y'},{a:984,v:'20',l:'z = 20 ✓',n:1}],
note:"r0 (20) written to z at 984 (BP-12). Result correct: 4×5=20."},
{ph:'ep',pl:'main returns',hl:[9,10],sp:1000,bp:1200,rg:{SP:'1000',BP:'1200',PC:'(OS)',r0:'0'},
mem:[{a:1000,v:'…',l:'(control → OS)'}],
note:"main() returns 0. Epilogue restores loader BP. Process terminates."}
];

const PC={p:'ph-p',e:'ph-e',ep:'ph-ep',c:'ph-c'};
let c=0;const e=s=>(s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function ren(){const s=ST[c],p=c>0?ST[c-1]:null;
// Phase
document.getElementById('mtPh').innerHTML=`<span class="mt-ph ${PC[s.ph]||''}">${s.pl}</span>`;
// Src
const hl=new Set(s.hl);
document.getElementById('mtSrc').innerHTML=SRC.map((l,i)=>`<span class="mt-sl${hl.has(i)?' on':''}">${e(l)}</span>`).join('\n');
// Mem
let h='<thead><tr><th>Addr</th><th>Value</th><th>Label</th><th></th></tr></thead><tbody>';
for(const r of s.mem){let cl=[];if(r.n)cl.push('new');if(r.f)cl.push('freed');let pt='';
if(r.a===s.sp&&!r.f)pt+='<span class="mt-ptr sp-ptr">◀SP</span>';
if(r.a===s.bp&&!r.f)pt+='<span class="mt-ptr bp-ptr">◀BP</span>';
h+=`<tr class="${cl.join(' ')}"><td>${r.a}</td><td>${e(r.v)}</td><td>${e(r.l)}</td><td>${pt}</td></tr>`;}
h+='</tbody>';document.getElementById('mtMem').innerHTML=h;
// Regs
const rg=s.rg,pr=p?p.rg:{};
document.getElementById('mtRegs').innerHTML=Object.entries(rg).map(([k,v])=>{const ch=pr[k]&&pr[k]!==v;
return`<div class="mt-rg"><div class="mt-rl">${k}</div><div class="mt-rv${ch?' ch':''}">${e(v)}</div></div>`}).join('');
// Note
document.getElementById('mtNote').textContent=s.note;
document.getElementById('mtLbl').textContent=`${c+1}/${ST.length}`;
document.getElementById('mtP').disabled=c===0;document.getElementById('mtN').disabled=c===ST.length-1;}
function go(d){c=Math.max(0,Math.min(ST.length-1,c+d));ren();}
ren();
</script>
