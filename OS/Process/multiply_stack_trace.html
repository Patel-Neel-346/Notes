<h2 class="sr-only">Interactive step-through: multiply(x, y) — stack frames, SP/BP, registers, and memory layout</h2>
<style>
*{box-sizing:border-box}
.mt-wrap{font-family:var(--font-text,system-ui,sans-serif);font-size:13px;color:var(--text-normal,#ddd);line-height:1.5}
.mt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.mt-panel{background:var(--surface-1,var(--background-secondary,#1e1e2e));border-radius:var(--radius,8px);padding:10px 12px}
.mt-label{font-size:11px;color:var(--text-muted,#888);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.mt-code{font-family:var(--font-mono,monospace);font-size:12px;white-space:pre;line-height:1.7}
.mt-src-line{padding:1px 4px;border-radius:3px;display:block}
.mt-src-active{background:var(--bg-accent,var(--interactive-accent,#7c3aed)22)}

/* Stack memory table */
.mt-mem{width:100%;border-collapse:collapse;font-family:var(--font-mono,monospace);font-size:12px}
.mt-mem th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--background-modifier-border,#333);color:var(--text-muted,#888);font-weight:500;font-size:11px}
.mt-mem td{padding:4px 8px;border-bottom:1px solid var(--background-modifier-border,#333)20}
.mt-mem tr.mt-sp td{border-left:3px solid var(--text-accent,var(--interactive-accent,#7c3aed))}
.mt-mem tr.mt-bp td{border-left:3px solid var(--text-success,#22c55e)}
.mt-mem tr.mt-new{background:var(--bg-accent,var(--interactive-accent,#7c3aed)15)}
.mt-mem tr.mt-freed{opacity:.4;text-decoration:line-through}
.mt-mem .mt-ptr{font-size:10px;font-weight:600;margin-left:4px}
.mt-ptr-sp{color:var(--text-accent,var(--interactive-accent,#7c3aed))}
.mt-ptr-bp{color:var(--text-success,#22c55e)}

/* Registers row */
.mt-regs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mt-reg{background:var(--surface-1,var(--background-secondary,#1e1e2e));border-radius:var(--radius,8px);padding:8px 10px;text-align:center}
.mt-reg-label{font-size:10px;color:var(--text-muted,#888);text-transform:uppercase;letter-spacing:.4px}
.mt-reg-val{font-family:var(--font-mono,monospace);font-size:14px;font-weight:600;margin-top:2px}
.mt-reg-changed{color:var(--text-accent,var(--interactive-accent,#7c3aed))}

/* Controls */
.mt-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.mt-controls button{font-size:13px;padding:6px 16px;border-radius:6px;border:1px solid var(--background-modifier-border,#444);background:var(--surface-1,var(--background-secondary,#1e1e2e));color:var(--text-normal,#ddd);cursor:pointer}
.mt-controls button:hover:not(:disabled){background:var(--bg-accent,var(--interactive-accent,#7c3aed)30)}
.mt-controls button:disabled{opacity:.35;cursor:default}
.mt-step-label{font-size:12px;color:var(--text-muted,#888);min-width:100px;text-align:center}
.mt-note{font-size:13px;color:var(--text-secondary,var(--text-muted,#aaa));margin:8px 0 0;line-height:1.55;padding:8px 10px;background:var(--surface-1,var(--background-secondary,#1e1e2e));border-radius:var(--radius,8px);border-left:3px solid var(--text-accent,var(--interactive-accent,#7c3aed))}
.mt-phase{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:3px 10px;border-radius:4px;display:inline-block;margin-bottom:8px}
.mt-phase-prologue{background:#7c3aed22;color:#a78bfa}
.mt-phase-execute{background:#3b82f622;color:#60a5fa}
.mt-phase-epilogue{background:#f59e0b22;color:#fbbf24}
.mt-phase-call{background:#10b98122;color:#34d399}
</style>

<div class="mt-wrap">
<div id="mtPhase"></div>
<div class="mt-grid">
  <div>
    <div class="mt-label">C source code</div>
    <div class="mt-panel"><div class="mt-code" id="mtSrc"></div></div>
  </div>
  <div>
    <div class="mt-label">Stack memory (grows ↓ toward low addresses)</div>
    <div class="mt-panel"><table class="mt-mem" id="mtMem"></table></div>
  </div>
</div>
<div class="mt-regs" id="mtRegs"></div>
<div class="mt-note" id="mtNote"></div>
<div class="mt-controls">
  <button id="mtPrev" onclick="mtStep(-1)">← Back</button>
  <span class="mt-step-label" id="mtLabel"></span>
  <button id="mtNext" onclick="mtStep(1)">Next →</button>
</div>
</div>

<script>
const SRC_LINES = [
  'int multiply(int a, int b) {',
  '    int result = a * b;',
  '    return result;',
  '}',
  '',
  'int main() {',
  '    int x = 4;',
  '    int y = 5;',
  '    int z = multiply(x, y);',
  '    return 0;',
  '}'
];

// Each step: { phase, srcHL (0-indexed lines to highlight), sp, bp, regs:{SP,BP,PC,r0}, mem (array of {addr,val,label,isNew,isFreed}), note }
const STEPS = [
  {
    phase: 'prologue', phaseLabel: 'main() Prologue',
    srcHL: [5],
    sp: 996, bp: 996,
    regs: {SP:'996', BP:'996', PC:'main+0', r0:'-'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:true}
    ],
    note: "The OS loader jumps to main(). The prologue saves the loader's Base Pointer (1200) onto the stack and sets BP = 996 to anchor main's frame."
  },
  {
    phase: 'execute', phaseLabel: 'main() — int x = 4',
    srcHL: [6],
    sp: 992, bp: 996,
    regs: {SP:'992', BP:'996', PC:'main+4', r0:'-'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x (BP-4)', isNew:true}
    ],
    note: "SP decrements by 4 to allocate space for x. The value 4 is written at address 992 (BP - 4)."
  },
  {
    phase: 'execute', phaseLabel: 'main() — int y = 5',
    srcHL: [7],
    sp: 988, bp: 996,
    regs: {SP:'988', BP:'996', PC:'main+8', r0:'-'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x (BP-4)', isNew:false},
      {addr:988, val:'5', label:'y (BP-8)', isNew:true}
    ],
    note: "SP decrements by 4 again. y = 5 is written at address 988 (BP - 8)."
  },
  {
    phase: 'execute', phaseLabel: 'main() — allocate z',
    srcHL: [8],
    sp: 984, bp: 996,
    regs: {SP:'984', BP:'996', PC:'main+12', r0:'-'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x (BP-4)', isNew:false},
      {addr:988, val:'5', label:'y (BP-8)', isNew:false},
      {addr:984, val:'0', label:'z (BP-12) — uninitialized', isNew:true}
    ],
    note: "Space for z is allocated at BP-12 (address 984). It holds 0 (uninitialized). SP is now 984. The full main() frame is set up."
  },
  {
    phase: 'call', phaseLabel: 'call multiply(x, y)',
    srcHL: [8],
    sp: 980, bp: 996,
    regs: {SP:'980', BP:'996', PC:'call 0x…', r0:'4', r1:'5'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x (BP-4)', isNew:false},
      {addr:988, val:'5', label:'y (BP-8)', isNew:false},
      {addr:984, val:'0', label:'z (BP-12)', isNew:false},
      {addr:980, val:'0x40052C', label:'Return Address → main (assign z)', isNew:true}
    ],
    note: "x (4) and y (5) are loaded into argument registers r0 and r1. The CPU pushes the return address (the instruction in main that will assign z) onto the stack at address 980, then jumps to multiply()."
  },
  {
    phase: 'prologue', phaseLabel: 'multiply() Prologue',
    srcHL: [0],
    sp: 976, bp: 976,
    regs: {SP:'976', BP:'976', PC:'multiply+0', r0:'4', r1:'5'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x (BP-4 of main)', isNew:false},
      {addr:988, val:'5', label:'y (BP-8 of main)', isNew:false},
      {addr:984, val:'0', label:'z (BP-12 of main)', isNew:false},
      {addr:980, val:'0x40052C', label:'Return Address → main', isNew:false},
      {addr:976, val:'996', label:'Saved main BP', isNew:true}
    ],
    note: "multiply()'s prologue pushes main's BP (996) onto the stack to preserve it, then sets the new BP = SP = 976. This anchors multiply's frame."
  },
  {
    phase: 'execute', phaseLabel: 'multiply() — int result = a * b',
    srcHL: [1],
    sp: 972, bp: 976,
    regs: {SP:'972', BP:'976', PC:'multiply+4', r0:'20'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x', isNew:false},
      {addr:988, val:'5', label:'y', isNew:false},
      {addr:984, val:'0', label:'z', isNew:false},
      {addr:980, val:'0x40052C', label:'Return Address → main', isNew:false},
      {addr:976, val:'996', label:'Saved main BP', isNew:false},
      {addr:972, val:'20', label:'result (BP-4) = 4 × 5', isNew:true}
    ],
    note: "The ALU computes a * b = 4 × 5 = 20. The result is written to address 972 (multiply's BP - 4). r0 now holds 20."
  },
  {
    phase: 'execute', phaseLabel: 'multiply() — return result',
    srcHL: [2],
    sp: 972, bp: 976,
    regs: {SP:'972', BP:'976', PC:'multiply+8', r0:'20'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x', isNew:false},
      {addr:988, val:'5', label:'y', isNew:false},
      {addr:984, val:'0', label:'z', isNew:false},
      {addr:980, val:'0x40052C', label:'Return Address → main', isNew:false},
      {addr:976, val:'996', label:'Saved main BP', isNew:false},
      {addr:972, val:'20', label:'result (BP-4)', isNew:false}
    ],
    note: "The return value (20) is placed in the return register r0. The CPU is about to begin the epilogue to tear down multiply's frame."
  },
  {
    phase: 'epilogue', phaseLabel: 'multiply() Epilogue — collapse frame',
    srcHL: [3],
    sp: 976, bp: 976,
    regs: {SP:'976', BP:'976', PC:'leave', r0:'20'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x', isNew:false},
      {addr:988, val:'5', label:'y', isNew:false},
      {addr:984, val:'0', label:'z', isNew:false},
      {addr:980, val:'0x40052C', label:'Return Address → main', isNew:false},
      {addr:976, val:'996', label:'Saved main BP', isNew:false},
      {addr:972, val:'20', label:'(freed) result — stale data', isNew:false, isFreed:true}
    ],
    note: "SP = BP = 976. The local variable 'result' at 972 is now logically freed — the bytes still sit in RAM but are below the stack pointer, meaning any new function call will overwrite them."
  },
  {
    phase: 'epilogue', phaseLabel: 'multiply() Epilogue — restore BP',
    srcHL: [3],
    sp: 980, bp: 996,
    regs: {SP:'980', BP:'996', PC:'pop rbp', r0:'20'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x', isNew:false},
      {addr:988, val:'5', label:'y', isNew:false},
      {addr:984, val:'0', label:'z', isNew:false},
      {addr:980, val:'0x40052C', label:'Return Address → main', isNew:false},
      {addr:976, val:'996', label:'(freed) Saved main BP', isNew:false, isFreed:true},
      {addr:972, val:'20', label:'(freed) result', isNew:false, isFreed:true}
    ],
    note: "The saved BP value (996) is popped from the stack back into the BP register. BP is now restored to 996 — pointing back into main's frame. SP moves to 980."
  },
  {
    phase: 'epilogue', phaseLabel: 'multiply() Epilogue — ret',
    srcHL: [8],
    sp: 984, bp: 996,
    regs: {SP:'984', BP:'996', PC:'0x40052C', r0:'20'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x (BP-4)', isNew:false},
      {addr:988, val:'5', label:'y (BP-8)', isNew:false},
      {addr:984, val:'0', label:'z (BP-12)', isNew:false}
    ],
    note: "The return address (0x40052C) is popped into the Program Counter. SP moves to 984. Execution resumes in main() at the instruction that assigns z. multiply's entire frame is now gone."
  },
  {
    phase: 'execute', phaseLabel: 'main() — z = multiply(x, y)',
    srcHL: [8],
    sp: 984, bp: 996,
    regs: {SP:'984', BP:'996', PC:'main+16', r0:'20'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame above)', isNew:false},
      {addr:996, val:'1200', label:'Saved Loader BP', isNew:false},
      {addr:992, val:'4', label:'x (BP-4)', isNew:false},
      {addr:988, val:'5', label:'y (BP-8)', isNew:false},
      {addr:984, val:'20', label:'z (BP-12) = 20 ✓', isNew:true}
    ],
    note: "The return register r0 (20) is written to z at address 984 (BP-12). z now holds the correct result: 4 × 5 = 20."
  },
  {
    phase: 'epilogue', phaseLabel: "main() Epilogue — return 0",
    srcHL: [9,10],
    sp: 1000, bp: 1200,
    regs: {SP:'1000', BP:'1200', PC:'(OS)', r0:'0'},
    mem: [
      {addr:1000, val:'...', label:'(loader frame — control returns to OS)', isNew:false}
    ],
    note: "main() returns 0. Its epilogue restores the loader's BP (1200) and pops the return address into PC. Control returns to the operating system. The process terminates."
  }
];

let cur = 0;

function renderSrc(hlSet) {
  return SRC_LINES.map((line, i) => {
    const cls = hlSet.has(i) ? ' mt-src-active' : '';
    return `<span class="mt-src-line${cls}">${escHtml(line)}</span>`;
  }).join('\n');
}
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMem(step) {
  let h = '<thead><tr><th>Address</th><th>Value</th><th>Label</th><th></th></tr></thead><tbody>';
  for (const row of step.mem) {
    let cls = [];
    if (row.isNew) cls.push('mt-new');
    if (row.isFreed) cls.push('mt-freed');
    if (row.addr === step.sp) cls.push('mt-sp');
    if (row.addr === step.bp && !row.isFreed) cls.push('mt-bp');
    let ptrs = '';
    if (row.addr === step.sp) ptrs += '<span class="mt-ptr mt-ptr-sp">◀ SP</span> ';
    if (row.addr === step.bp && !row.isFreed) ptrs += '<span class="mt-ptr mt-ptr-bp">◀ BP</span>';
    h += `<tr class="${cls.join(' ')}"><td>${row.addr}</td><td>${escHtml(row.val)}</td><td>${escHtml(row.label)}</td><td>${ptrs}</td></tr>`;
  }
  h += '</tbody>';
  return h;
}

function renderRegs(step, prev) {
  const keys = step.regs.r1 !== undefined ? ['SP','BP','PC','r0','r1'] : ['SP','BP','PC','r0'];
  return keys.map(k => {
    const v = step.regs[k] || '-';
    const changed = prev && prev.regs[k] !== v;
    return `<div class="mt-reg"><div class="mt-reg-label">${k}</div><div class="mt-reg-val${changed?' mt-reg-changed':''}">${escHtml(String(v))}</div></div>`;
  }).join('');
}

const PHASE_CLS = {prologue:'mt-phase-prologue',execute:'mt-phase-execute',epilogue:'mt-phase-epilogue',call:'mt-phase-call'};

function render() {
  const step = STEPS[cur];
  const prev = cur > 0 ? STEPS[cur-1] : null;
  const hlSet = new Set(step.srcHL);

  document.getElementById('mtPhase').innerHTML = `<span class="mt-phase ${PHASE_CLS[step.phase]||''}">${step.phaseLabel}</span>`;
  document.getElementById('mtSrc').innerHTML = renderSrc(hlSet);
  document.getElementById('mtMem').innerHTML = renderMem(step);
  document.getElementById('mtRegs').innerHTML = renderRegs(step, prev);
  document.getElementById('mtNote').textContent = step.note;
  document.getElementById('mtLabel').textContent = `Step ${cur+1} of ${STEPS.length}`;
  document.getElementById('mtPrev').disabled = cur === 0;
  document.getElementById('mtNext').disabled = cur === STEPS.length - 1;
}

function mtStep(d) {
  cur = Math.max(0, Math.min(STEPS.length - 1, cur + d));
  render();
}

render();
</script>
