<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-text,system-ui,sans-serif);font-size:12px;color:var(--text-normal,#ddd);line-height:1.4;padding:6px;background:transparent}
.rc-row{display:flex;gap:6px;margin-bottom:5px}
.rc-col{flex:1;min-width:0}
.rc-lbl{font-size:9px;color:var(--text-muted,#888);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.rc-box{background:var(--background-secondary,#1e1e2e);border-radius:6px;padding:5px 7px;font-family:var(--font-mono,monospace);font-size:11px}

/* Assembly - compact scrollable */
.rc-asm{max-height:130px;overflow-y:auto;line-height:1.5}
.rc-al{display:flex;gap:4px;padding:1px 3px;border-radius:2px;white-space:nowrap}
.rc-al.on{background:var(--interactive-accent,#7c3aed)22;font-weight:600}
.rc-aa{color:var(--text-muted,#888);width:38px;flex-shrink:0}
.rc-ai{width:110px;flex-shrink:0}
.rc-ac{color:var(--text-faint,#666);font-size:10px;overflow:hidden;text-overflow:ellipsis}
.rc-foo{color:var(--interactive-accent,#a78bfa)}
.rc-main{color:var(--text-muted,#aaa)}

/* Source - compact */
.rc-src{line-height:1.5;font-size:11px;max-height:110px;overflow-y:auto}
.rc-sl{padding:0 3px;border-radius:2px;display:block}
.rc-sl.on{background:var(--interactive-accent,#7c3aed)18}

/* Registers - single row */
.rc-regs{display:flex;gap:4px;margin-bottom:5px}
.rc-rg{flex:1;background:var(--background-secondary,#1e1e2e);border-radius:5px;padding:3px 5px;text-align:center}
.rc-rl{font-size:8px;color:var(--text-muted,#888);text-transform:uppercase}
.rc-rv{font-family:var(--font-mono,monospace);font-size:12px;font-weight:600}
.rc-rv.ch{color:var(--interactive-accent,#7c3aed)}

/* Stack + Cache */
.rc-fp{font-family:var(--font-mono,monospace);font-size:10px;background:var(--background-secondary,#1e1e2e);border-radius:4px;padding:2px 6px;margin-bottom:2px;display:flex;justify-content:space-between}
.rc-cb{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block}
.rc-hit{background:#16a34a22;color:#22c55e}
.rc-miss{background:#dc262622;color:#ef4444}

/* Note */
.rc-note{font-size:11px;color:var(--text-muted,#aaa);line-height:1.4;padding:4px 6px;background:var(--background-secondary,#1e1e2e);border-radius:5px;border-left:2px solid var(--interactive-accent,#7c3aed);margin-bottom:5px;min-height:32px}

/* Controls */
.rc-ctrl{display:flex;align-items:center;justify-content:center;gap:8px}
.rc-ctrl button{font-size:11px;padding:3px 10px;border-radius:4px;border:1px solid #444;background:var(--background-secondary,#1e1e2e);color:var(--text-normal,#ddd);cursor:pointer}
.rc-ctrl button:disabled{opacity:.3}
.rc-cl{font-size:10px;color:var(--text-muted,#888);min-width:80px;text-align:center}
</style>

<div class="rc-row">
  <div class="rc-col"><div class="rc-lbl">Assembly</div><div class="rc-box rc-asm" id="rcAsm"></div></div>
  <div class="rc-col">
    <div class="rc-lbl">C Source</div><div class="rc-box rc-src" id="rcSrc"></div>
    <div class="rc-lbl" style="margin-top:4px">Call Stack</div>
    <div id="rcStk"></div>
  </div>
</div>
<div class="rc-regs" id="rcRegs"></div>
<div style="margin-bottom:5px"><span class="rc-lbl">Cache </span><span id="rcCch" class="rc-cb">-</span></div>
<div class="rc-note" id="rcNote"></div>
<div class="rc-ctrl">
  <button id="rcP" onclick="go(-1)">← Back</button>
  <span class="rc-cl" id="rcLbl"></span>
  <button id="rcN" onclick="go(1)">Next →</button>
</div>

<script>
const A=[
  [0x1149,'push rbp','save caller FP','f'],[0x114a,'mov rbp,rsp','anchor frame','f'],
  [0x114d,'sub rsp,16','alloc locals','f'],[0x1151,'mov [rbp-4],edi','store a','f'],
  [0x1154,'cmp [rbp-4],0','compare a to 0','f'],[0x1158,'jg 0x1170','a>0? → base','f'],
  [0x115a,'mov eax,[rbp-4]','eax=a','f'],[0x115d,'add eax,1','eax=a+1','f'],
  [0x1160,'mov edi,eax','set arg','f'],[0x1163,'call 0x1149','RECURSE','f'],
  [0x1168,'jmp 0x1174','← resume here','f'],[0x1170,'mov eax,[rbp-4]','base: eax=a','f'],
  [0x1174,'leave','SP=BP, pop BP','f'],[0x1175,'ret','pop ret→PC','f'],
  [0x1180,'push rbp','','m'],[0x1181,'mov rbp,rsp','','m'],
  [0x1184,'mov edi,-1','a = -1','m'],[0x1189,'call 0x1149','call foo(-1)','m'],
  [0x118e,'mov ecx,eax','← result','m'],[0x1190,'mov eax,0','return 0','m'],
  [0x1193,'pop rbp','','m'],[0x1194,'ret','','m']
];
const S=['int foo(int a)','{','    if (a <= 0)','        return foo(a + 1);','    else','        return a;','}','','int main()','{','    foo(-1);','    return 0;','}'];
const SH={0x1149:[0,1],0x114a:[0,1],0x114d:[0,1],0x1151:[0,1],0x1154:[2],0x1158:[2],0x115a:[3],0x115d:[3],0x1160:[3],0x1163:[3],0x1168:[3],0x1170:[5],0x1174:[6],0x1175:[6],0x1180:[8,9],0x1181:[8,9],0x1184:[10],0x1189:[10],0x118e:[11],0x1190:[11],0x1193:[12],0x1194:[12]};
const hx=n=>'0x'+n.toString(16);
const tc={f:false,m:false};
const st=[];const sk=[];let sp=2000;
function sn(){return sk.map(f=>({...f}))}
function fe(addr,note){const b=addr>=0x1149&&addr<=0x1175?'f':'m';const c=tc[b]?'HIT':'MISS';tc[b]=true;const t=sk[sk.length-1]||{n:'main',a:null,r:null};st.push({addr,note,c,sk:sn(),a:t.a,r:t.r,sp})}
sk.push({n:'main',a:null,r:null});
fe(0x1180,"main() prologue — save BP, anchor frame.");
fe(0x1184,"Load a = -1 into edi.");
fe(0x1189,"main calls foo(-1): push ret addr 0x118e, jump to foo.");
function ef(a,ra){sp-=16;sk.push({n:'foo',a,r:hx(ra)});const ft=!tc.f;
fe(0x1149,`foo(${a}) entered — prologue.${ft?' FIRST fetch of foo → ~100ns RAM.':''}`);
fe(0x1154,`Compare a(${a}) to 0.`);fe(0x1158,`Is ${a}>0?`);
if(a<=0){fe(0x1163,`${a}<=0 → recurse: call foo(${a+1}), push ret 0x1168.`);ef(a+1,0x1168);
fe(0x1168,`Back in foo(${a}) — resumed at 0x1168.`);fe(0x1174,'Epilogue: leave.');fe(0x1175,`ret → pop ${hx(ra)} into PC.`);
}else{fe(0x1170,`${a}>0 — BASE CASE. eax = ${a}.`);fe(0x1174,'Epilogue: leave.');fe(0x1175,`ret → pop ${hx(ra)} into PC.`);}
sk.pop();sp+=16;}
ef(-1,0x118e);
fe(0x118e,"main resumes — result of foo(-1) now in eax.");
fe(0x1194,"main returns. Process ends.");

let c=0;const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function ren(){const s=st[c],p=c>0?st[c-1]:null;
// Asm - auto-scroll to active
const ai=A.findIndex(r=>r[0]===s.addr);
document.getElementById('rcAsm').innerHTML=A.map((r,i)=>`<div class="rc-al${r[0]===s.addr?' on':''}">`+
`<span class="rc-aa">${hx(r[0])}</span><span class="rc-ai rc-${r[3]==='f'?'foo':'main'}">${e(r[1])}</span>`+
`<span class="rc-ac">${e(r[2])}</span></div>`).join('');
const el=document.getElementById('rcAsm');const act=el.children[ai];if(act)act.scrollIntoView({block:'center',behavior:'smooth'});

// Src
const hl=new Set(SH[s.addr]||[]);
document.getElementById('rcSrc').innerHTML=S.map((l,i)=>`<span class="rc-sl${hl.has(i)?' on':''}">${e(l)}</span>`).join('\n');

// Regs
const rg={PC:hx(s.addr),Ret:s.r||'-','a':s.a!==null&&s.a!==undefined?''+s.a:'-',SP:''+s.sp};
const pr=p?{PC:hx(p.addr),Ret:p.r||'-','a':p.a!==null&&p.a!==undefined?''+p.a:'-',SP:''+p.sp}:null;
document.getElementById('rcRegs').innerHTML=Object.entries(rg).map(([k,v])=>{const ch=pr&&pr[k]!==v;
return`<div class="rc-rg"><div class="rc-rl">${k}</div><div class="rc-rv${ch?' ch':''}">${e(v)}</div></div>`}).join('');

// Stack
document.getElementById('rcStk').innerHTML=s.sk.slice().reverse().map(f=>
`<div class="rc-fp"><span>${f.n}${f.a!==null&&f.a!==undefined?'('+f.a+')':'()'}</span><span style="color:#888">→${f.r||'OS'}</span></div>`).join('');

// Cache
const cb=document.getElementById('rcCch');
cb.textContent=s.c==='HIT'?'L1 HIT ~1ns':'MISS ~100ns';cb.className='rc-cb '+(s.c==='HIT'?'rc-hit':'rc-miss');

document.getElementById('rcNote').textContent=s.note;
document.getElementById('rcLbl').textContent=`${c+1}/${st.length}`;
document.getElementById('rcP').disabled=c===0;document.getElementById('rcN').disabled=c===st.length-1;}
function go(d){c=Math.max(0,Math.min(st.length-1,c+d));ren();}
ren();
</script>
